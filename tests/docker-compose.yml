services:
  pg12:
    image: postgres:12-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgcompact_test
    ports:
      - "55412:5432"
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data

  pg17:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgcompact_test
    ports:
      - "55417:5432"
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
